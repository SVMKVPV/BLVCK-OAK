name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - name: Verify the exact Netlify release
        run: node scripts/release-smoke.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_PR: ${{ github.event.pull_request.number }}
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Keep public build and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-release-${{ github.run_id }}
          path: |
            dist/
            release-smoke-results.json
          retention-days: 7

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npm install --prefix /tmp/e2e @playwright/test@1.58.2 @lhci/cli@0.14.0
      - run: /tmp/e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser smoke tests
        run: /tmp/e2e/node_modules/.bin/playwright test --config e2e/playwright.config.mjs
        env:
          NODE_PATH: /tmp/e2e/node_modules
      - name: Lighthouse budgets
        run: /tmp/e2e/node_modules/.bin/lhci autorun --config=lighthouserc.json
