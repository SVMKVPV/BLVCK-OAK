name: Capture portfolio homepages
on:
  push:
    branches: [main]
    paths:
      - scripts/capture-portfolio.cjs
      - .github/workflows/portfolio-screenshots.yml
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Prepare capture browser
        run: |
          npm install --prefix /tmp/portfolio-capture playwright@1.58.2
          /tmp/portfolio-capture/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture actual homepage designs
        env:
          PLAYWRIGHT_MODULE: /tmp/portfolio-capture/node_modules/playwright
        run: node scripts/capture-portfolio.cjs
      - name: Open a pull request with captured thumbnails
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/portfolio-screenshots
          commit-message: Show actual homepage screenshots in portfolio cards
          title: Refresh portfolio homepage screenshots
          body: Captured by the portfolio screenshot workflow. Merge after the Verify check passes.
          add-paths: |
            assets/portfolio/screenshots
            portfolio.html
